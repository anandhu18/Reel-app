<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #F1EFF8; --panel: #FFFFFF; --ink: #1B1530; --muted: #6B6684; --line: #D9D4EA;
  --accent: #5B3DF5; --on-accent: #FFFFFF; --warn: #B3243F; --frame: #1B1530;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15111F; --panel: #1E1830; --ink: #EEEAFB; --muted: #9C97B5; --line: #2E2745;
    --accent: #8A74FF; --on-accent: #15111F; --warn: #FF7D96; --frame: #0B0813;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Instrument Sans", system-ui, sans-serif; }
h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; line-height: 1; }
h2 { font-size: 1.25rem; font-weight: 800; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 18px 80px; }
.lede { color: var(--muted); margin: 10px 0 28px; max-width: 46ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .stage { order: -1; position: static !important; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.stack > * + * { margin-top: 14px; }
button, .btn {
  font: 600 1rem "Instrument Sans", system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-block; text-align: center;
  border: 0; border-radius: 10px; padding: 12px 18px; background: var(--accent); color: var(--on-accent);
}
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.small { padding: 6px 10px; font-size: .85rem; }
button:disabled { opacity: .5; cursor: progress; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.scene { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.scene header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.scene header strong { font-family: "Bricolage Grotesque", sans-serif; }
.scene.hook { border-color: var(--accent); border-width: 2px; }
.hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.msg { margin-top: 12px; font-size: .95rem; }
.msg.error { color: var(--warn); }
.notice { border-left: 4px solid var(--warn); padding: 8px 12px; margin-bottom: 18px; font-size: .92rem; }

.stage { position: sticky; top: 18px; }
.phone {
  aspect-ratio: 9 / 16; width: 100%; background: var(--frame); border-radius: 30px; padding: 8px;
  box-shadow: 0 0 0 1px var(--line);
}
.screen { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; display: grid; place-items: center; background: #000; color: #fff; text-align: center; padding: 22px; position: relative; }
.screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bar { width: 100%; height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; margin-top: 16px; }
.bar > i { display: block; height: 100%; width: 0; background: #fff; transition: width .4s; }
.screen p { margin: 0; }
.screen .big { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.out { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.out > * { flex: 1; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reel Studio</h1>
  <p class="lede">Pick a topic. Get a script, voiceover and captions cut into a vertical video, ready to post.</p>

  <div id="setup" class="notice" hidden></div>

  <div class="grid">
    <main>
      <section class="panel">
        <h2>1. Topic</h2>
        <div class="stack" style="margin-top:14px">
          <div>
            <label for="topic">What is the reel about?</label>
            <input id="topic" placeholder="e.g. 3 habits that quietly make you rich" maxlength="200">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="tone">Tone</label>
            <select id="tone">
              <option>energetic</option><option>calm and clear</option><option>bold and direct</option><option>storytelling</option>
            </select>
          </div>
          <div>
            <label for="length">Length</label>
            <select id="length">
              <option value="15">About 15 seconds</option>
              <option value="30" selected>About 30 seconds</option>
              <option value="45">About 45 seconds</option>
            </select>
          </div>
        </div>
        <div class="actions"><button id="writeBtn">Write script</button></div>
        <p id="scriptMsg" class="msg" role="alert"></p>
      </section>

      <section id="editor" class="panel" hidden>
        <h2>2. Script</h2>
        <p class="hint">Edit any line. The footage search decides which stock clip plays under it.</p>
        <div id="scenes" class="stack" style="margin-top:14px"></div>
        <div class="stack" style="margin-top:18px">
          <div><label for="caption">Caption</label><textarea id="caption"></textarea></div>
          <div><label for="tags">Hashtags</label><input id="tags"></div>
        </div>
        <div class="actions">
          <button id="addScene" class="ghost">Add scene</button>
          <button id="makeBtn">Make video</button>
        </div>
        <p id="makeMsg" class="msg" role="alert"></p>
      </section>
    </main>

    <aside class="stage" aria-live="polite">
      <div class="phone">
        <div class="screen" id="screen">
          <p id="idle" class="big">Your reel shows up here</p>
          <div id="working" hidden style="width:100%">
            <p class="big" id="step">Starting</p>
            <div class="bar"><i id="fill"></i></div>
          </div>
          <video id="player" controls playsinline hidden></video>
        </div>
      </div>
      <div class="out" id="out" hidden>
        <a id="dl" class="btn" download="reel.mp4">Download video</a>
        <button id="copy" class="ghost">Copy caption</button>
      </div>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { scenes: [], caption: '', hashtags: [] };

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n[k] = v;
  }
  kids.forEach((c) => n.append(c));
  return n;
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function renderScenes() {
  const box = $('scenes');
  box.replaceChildren();
  state.scenes.forEach((s, i) => {
    const narr = el('textarea', { value: s.narration, id: `n${i}`, oninput: (e) => (s.narration = e.target.value) });
    const kw = el('input', { value: s.keywords, id: `k${i}`, oninput: (e) => (s.keywords = e.target.value) });
    const head = el('header', {}, el('strong', {}, i === 0 ? 'Hook' : `Scene ${i + 1}`));
    if (state.scenes.length > 1) {
      head.append(el('button', { class: 'ghost small', type: 'button', onclick: () => { state.scenes.splice(i, 1); renderScenes(); } }, 'Remove'));
    }
    box.append(el('div', { class: 'scene' + (i === 0 ? ' hook' : '') },
      head,
      el('label', { htmlFor: `n${i}` }, 'Spoken line'), narr,
      el('label', { htmlFor: `k${i}`, style: 'margin-top:10px' }, 'Footage search'), kw));
  });
}

$('writeBtn').onclick = async () => {
  const btn = $('writeBtn'); const msg = $('scriptMsg');
  msg.className = 'msg'; msg.textContent = 'Writing your script…'; btn.disabled = true;
  try {
    const data = await api('/api/script', { topic: $('topic').value, tone: $('tone').value, durationSec: Number($('length').value) });
    state.scenes = data.scenes; state.caption = data.caption; state.hashtags = data.hashtags;
    $('caption').value = data.caption; $('tags').value = data.hashtags.join(' ');
    renderScenes(); $('editor').hidden = false; msg.textContent = '';
    $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) { msg.className = 'msg error'; msg.textContent = e.message; }
  btn.disabled = false;
};

$('addScene').onclick = () => { state.scenes.push({ narration: '', keywords: '' }); renderScenes(); };

$('makeBtn').onclick = async () => {
  const btn = $('makeBtn'); const msg = $('makeMsg');
  msg.className = 'msg'; msg.textContent = ''; btn.disabled = true;
  $('out').hidden = true; $('idle').hidden = true; $('player').hidden = true; $('working').hidden = false;
  $('fill').style.width = '0'; $('step').textContent = 'Starting';
  $('screen').scrollIntoView({ behavior: 'smooth', block: 'center' });
  try {
    const { id } = await api('/api/render', { scenes: state.scenes });
    while (true) {
      await new Promise((r) => setTimeout(r, 1500));
      const job = await api(`/api/jobs/${id}`);
      $('step').textContent = job.step || 'Working';
      $('fill').style.width = `${job.progress || 0}%`;
      if (job.status === 'error') throw new Error(job.error || 'Render failed');
      if (job.status === 'done') {
        $('working').hidden = true;
        const p = $('player'); p.src = job.url; p.hidden = false; p.play().catch(() => {});
        $('dl').href = job.url; $('out').hidden = false;
        break;
      }
    }
  } catch (e) {
    $('working').hidden = true; $('idle').hidden = false;
    $('idle').textContent = 'The video did not finish';
    msg.className = 'msg error'; msg.textContent = e.message;
  }
  btn.disabled = false;
};

$('copy').onclick = async () => {
  const text = `${$('caption').value}\n\n${$('tags').value}`.trim();
  await navigator.clipboard.writeText(text);
  $('copy').textContent = 'Copied';
  setTimeout(() => ($('copy').textContent = 'Copy caption'), 1500);
};

api('/api/config').then((c) => {
  const missing = [];
  if (!c.claude) missing.push('GEMINI_API_KEY (scripts)');
  if (!c.pexels) missing.push('PIXABAY_API_KEY (footage)');
  const parts = [];
  if (missing.length) parts.push(`Add to your .env file: ${missing.join(', ')}.`);
  if (!c.voice) parts.push('No ELEVENLABS_API_KEY set, so videos will have captions but no voiceover.');
  if (parts.length) { $('setup').textContent = parts.join(' '); $('setup').hidden = false; }
});
</script>
</body>
</html>
